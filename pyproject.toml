[project]
name = "tfg"
version = "0.1.0"
description = "Macro Nutrient Prediction from Food Images"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "huggingface-hub",
    "optuna",
    "pandas",
    "pillow",
    "requests",
    "scikit-learn",
    "torch",
    "torchvision",
    "tqdm",
    "langchain",
    "langchain_community",
    "langchain_google_genai",
    "geocoder",
    "kaleido>=1.3.0",
    "plotly>=6.8.0",
    "jupyter>=1.1.1",
    "torchviz>=0.0.3",
    "graphviz>=0.21",
]

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project.scripts]
load-data='src.scripts.load_data:main'
study='src.scripts.study:main'
train_test='src.scripts.train_test:main'
swin-ft='src.studies.swin_fine_tuning:main'
swin-ft-scl='src.studies.swin_ft_scl:main'
